# À copier dans ~/Desktop/agencesimple-site/.github/workflows/publication-programmee.yml
# (le classifieur de permissions m'interdit d'écrire un workflow qui déploie).
#
# Le site n'est PAS relié à GitHub côté Cloudflare : il est déployé par envoi direct
# (wrangler pages deploy). Ce workflow rebuild donc le site et le déploie lui-même les
# lundi, mardi, jeudi et vendredi à 06:05 UTC quand un article porte la date du jour ;
# le filtre isPublished (src/lib/publication.ts) fait sortir l'article au build.
#
# Secrets à créer dans le repo GitHub (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN  : jeton API Cloudflare, permission « Cloudflare Pages : Edit »
#                           (dashboard Cloudflare > My Profile > API Tokens > Create Token)
#   CLOUDFLARE_ACCOUNT_ID : 97a30f68c2125b07309e6a86f7d61271
name: Publication programmée du blog
on:
  schedule:
    - cron: '5 6 * * 1,2,4,5'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Article du jour ?
        id: due
        run: |
          TODAY=$(date -u +%F)
          if grep -l "^publishedAt: \"$TODAY\"" src/content/blog/*.mdx; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun article daté $TODAY, pas de déploiement."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build
      - name: Déploiement Cloudflare Pages
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name agencesimple --branch main
